name: Publish Release

on:
  push:
    branches:
      - main
    paths:
      - package.json
      - .github/workflows/release.yml

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'whoisrez/CFB27-Team-Needs'
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run verify

      - name: Build Windows installer
        run: npx electron-forge make --platform=win32 --arch=x64

      - name: Build portable ZIP
        run: node scripts/make-portable.cjs

      - name: Verify release output
        run: npm run release:verify-output

      - name: Resolve release files
        id: release
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "v$version"
          $setup = Get-ChildItem -Path "out\make" -Recurse -File -Filter "CFB-27-Team-Needs-Setup.exe" | Select-Object -First 1
          if (-not $setup) { throw "Windows installer was not created." }
          $portable = Resolve-Path "out\make\portable\CFB-27-Team-Needs-Portable.zip"
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "setup=$($setup.FullName)" >> $env:GITHUB_OUTPUT
          "portable=$portable" >> $env:GITHUB_OUTPUT

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.release.outputs.tag }}"
          $setup = "${{ steps.release.outputs.setup }}"
          $portable = "${{ steps.release.outputs.portable }}"
          $notesPath = Join-Path $env:RUNNER_TEMP "release-notes.md"
          $notes = @(
            '## CFB 27 Team Needs',
            '',
            'Standalone Windows roster-planning utility for EA Sports College Football 27 dynasty saves.',
            '',
            '### v0.1.2',
            '- Automatically detects the currently controlled dynasty school from `Team.UserCharacter`.',
            '- Works across dynasty teams instead of relying on FIU-specific behavior.',
            '- Keeps manual team selection as a fallback when the save cannot expose a controlled-team reference.',
            '- Includes team branding, roster targets, graduating-player counts, manual transfer/cut/recruit inputs, and saved per-team values.',
            '- Release verification confirms the portable package contains no previous user data.',
            '',
            '### Downloads',
            '- `CFB-27-Team-Needs-Setup.exe` — standard Windows installer.',
            '- `CFB-27-Team-Needs-Portable.zip` — portable build; extract the folder and run `CFB 27 Team Needs.exe`.',
            '',
            'Windows may show a SmartScreen warning because this release is not code-signed.'
          )
          Set-Content -Path $notesPath -Value $notes -Encoding utf8

          gh release create $tag $setup $portable `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "CFB 27 Team Needs $tag" `
            --notes-file $notesPath `
            --latest
